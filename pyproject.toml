[project]
name = "hubble"
version = "0.1.0"
description = "Análisis y descompilación de aplicaciones MultiBase Cosmos (módulos .omd y ficheros asociados)"
requires-python = ">=3.13"
license = "AGPL-3.0-only"
dependencies = []

[project.scripts]
hubble = "hubble.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hubble"]

[tool.pytest.ini_options]
testpaths = ["tests"]
